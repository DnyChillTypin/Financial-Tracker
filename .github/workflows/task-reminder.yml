# Manual fallback: calls /cron/tasks on Render to send the task list now.
# The 07:00 / 22:00 schedule lives in Google Apps Script (time-driven
# triggers), because GitHub's scheduled runs were hours late or skipped.
# Requires the repository secret CRON_SECRET (same value as on Render).
name: Task reminder

on:
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /cron/tasks
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Cold starts can take 60s+, so allow long waits and retry.
          curl --fail --silent --show-error \
            --max-time 180 --retry 3 --retry-delay 20 --retry-all-errors \
            "https://financial-tracker-wb7z.onrender.com/cron/tasks?key=${CRON_SECRET}"
